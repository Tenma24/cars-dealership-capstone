name: Capstone CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 server scripts --count --select=E9,F63,F7,F82 --show-source --statistics
  lint_javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install dependencies
        run: npm install --prefix /tmp/capstone-eslint eslint@9.39.1
      - name: Lint with ESLint
        run: /tmp/capstone-eslint/node_modules/.bin/eslint server/frontend/src/App.jsx server/frontend/src/main.jsx server/frontend/src/api.js server/frontend/src/components/Register/Register.jsx server/database/app.js server/database/app.test.js
  test:
    # MongoDB 8 requires a runner kernel without SERVER-121912.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install Python dependencies
        run: pip install -r server/requirements.txt -r server/djangoapp/microservices/requirements.txt
      - name: Django checks and acceptance tests
        working-directory: server
        run: |
          python manage.py check
          coverage run --source=djangoapp --omit='*/tests.py,*/migrations/*,*/microservices/*,*/management/*,*/populate.py' manage.py test djangoapp
          coverage report --fail-under=80
      - name: Build React interface
        working-directory: server/frontend
        run: npm ci && npm run build
      - name: Test Node service with MongoDB
        working-directory: server/database
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017
          SERVICE_TOKEN: ci-test-service-token
        run: npm ci && npm test
      - name: Test sentiment service
        run: python -m unittest discover -s server/djangoapp/microservices -p 'test_*.py'
      - name: Browser workflow tests
        run: |
          python scripts/run_local.py > /tmp/capstone.log 2>&1 &
          cd server/frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capstone-evidence
          path: |
            evidence/
            server/frontend/test-results/
