apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: cars-sqlite}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cars-web}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: cars-web}
  template:
    metadata:
      labels: {app: cars-web}
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.37
          command: [sh, -c, 'chown 1000:1000 /data']
          volumeMounts: [{name: sqlite, mountPath: /data}]
      containers:
        - name: web
          image: REGISTRY/cars-web:1
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: cars-secrets}}]
          env:
            - {name: DJANGO_DEBUG, value: '0'}
            - {name: DJANGO_ALLOWED_HOSTS, value: cars.example.com}
            - {name: CSRF_TRUSTED_ORIGINS, value: 'https://cars.example.com'}
            - {name: BACKEND_URL, value: 'http://cars-database:3030'}
            - {name: SENTIMENT_URL, value: 'http://cars-sentiment:5050'}
          volumeMounts: [{name: sqlite, mountPath: /data}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
      volumes: [{name: sqlite, persistentVolumeClaim: {claimName: cars-sqlite}}]
---
apiVersion: v1
kind: Service
metadata: {name: cars-web}
spec:
  selector: {app: cars-web}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cars-database}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cars-database}
  template:
    metadata:
      labels: {app: cars-database}
    spec:
      containers:
        - name: database
          image: REGISTRY/cars-database:1
          ports: [{containerPort: 3030}]
          envFrom: [{secretRef: {name: cars-secrets}}]
          readinessProbe:
            httpGet: {path: /health, port: 3030}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: cars-database}
spec:
  selector: {app: cars-database}
  ports: [{port: 3030, targetPort: 3030}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cars-sentiment}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cars-sentiment}
  template:
    metadata:
      labels: {app: cars-sentiment}
    spec:
      containers:
        - name: sentiment
          image: REGISTRY/cars-sentiment:1
          ports: [{containerPort: 5050}]
          readinessProbe:
            httpGet: {path: /health, port: 5050}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: cars-sentiment}
spec:
  selector: {app: cars-sentiment}
  ports: [{port: 5050, targetPort: 5050}]
